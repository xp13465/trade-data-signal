# daily_brief 每日AI预测 配置(第一阶段,单 prompt 主链路)
# 用户改此文件即可控制,与代码解耦。生成脚本 scripts/gen_daily_brief.py 读此配置。

# ── 调度开关(用户 2026-08-10 定,默认关闭;2026-08-11 开启:独立 plist 20:40)──
#   false = 不自动跑:独立 launchd plist(com.trade.daily-brief)入口被拦截,
#           主控/用户手动 `python3 scripts/gen_daily_brief.py` 始终可跑
#   true  = 每天自动跑:com.trade.daily-brief 20:40 独立 plist 调 run_daily_brief.sh
#           (update_all.sh 17:50 挂载已注释,一天一次 20:40,避 20:35 intraday-snapshot)
schedule_enabled: true

# ── 合规开关(默认开启)─────────────────────────────────────────────────
#   true  = prompt 禁指令词(买入/卖出/加仓/建仓/仓位等黑名单,只允许 关注/警惕/观察/留意)
#           + 生成后正则脱敏兜底 + 免责声明行(对外安全)
#   false = 不禁输出更直观(自用)
compliance_enabled: true

# ── deepseek 调用参数 ─────────────────────────────────────────────────
model: deepseek-chat          # 默认模型(env DEEPSEEK_MODEL 可覆盖)
timeout_seconds: 60           # 单次 API 超时
max_retries: 2                # 超时/5xx/429 重试次数(429 退避 2^n 秒)
temperature: 0.4              # 生成确定性

# ── 多角色协作式编排(P0-4,2026-08-11 实施,见 docs/ai-predict-multiagent-plan.md)──
#   6 角色: ①技术面 ②资金面 ③情绪面 ④风控(并行) -> ⑤研究员(多空辩论,串行) -> ⑥主编组装。
#   每角色只喂自己数据域;任一环节失败降级单 prompt 主链路(保底不破)。
#   2026-08-11 起生产开启(launchd plist 也带 --multi 双保险);任一生效即走 6 角色编排。
#   false = 单 prompt 主链路(默认);true = 每次生成(含 launchd)走 6 角色编排。
multi_agent_enabled: true     # 生产=多角色(技术/资金/情绪/风控->研究员多空辩论->主编组装)
researcher_model: deepseek-chat  # ⑤研究员模型:deepseek-chat(V3)/deepseek-reasoner(R1 深度辩论,P1-11)
researcher_use_reasoner: false    # #9 开关:true→研究员用 deepseek-reasoner(R1),false→用 researcher_model
researcher_timeout_seconds: 120   # #9 reasoner 专用超时(普通角色 90s,R1 推理更长)
multi_agent_timeout_seconds: 90  # 单角色调用超时
max_role_retries: 1              # 角色失败重试次数(4 角色并行,失败过多降级单 prompt)

# ── 生成后通知(2026-08-11 追加需求:完整版 先总结再细讲)─────────────────────
#   生成成功(含 --multi 版)后发 邮件+飞书报告群(notify.py,post 富文本+A股红涨绿跌)。
#   编排: 【总结段】方向/信心/高亮要点/多空结论+一句话 → 【细讲段】关注/风险/趋势/把握度理由 + 多空辩论过程(bull/bear)。
#   同日(date)只发一次(dedup key=daily_brief_notify_<date>,window=86400);失败不阻塞主流程。
notify_enabled: true          # true=生成后邮件+飞书报告群通知;false=关闭

# ── 输出 ──────────────────────────────────────────────────────────────
max_watch_items: 5            # 明日关注标的条数上限
# 免责声明行(输出 meta.disclaimer + text.note 末尾)。{date} 被替换为预测日期。
disclaimer: "AI 生成,研究用途,不构成投资建议。基于 {date} 收盘数据,历史命中率不代表未来。"

# ── 成本监控(P2-1)─────────────────────────────────────────────────────
cost_log: data/daily_brief_cost.log      # 每次调用 token/费用 追加日志(相对 repo 根)
input_price_per_million: 2.0             # ¥/百万 input tokens(deepseek-chat 参考价)
output_price_per_million: 8.0            # ¥/百万 output tokens
monthly_warn_yuan: 20.0                  # 月度累计费用超此阈值 -> notify.py 告警

# ── 深度思考能力「连接配置」(2026-08-16 部署,仅影响 AI 预测 API 调用)─────────
# 只做「连路」:把 call_deepseek() 从单官方端点扩展为 官方+火山方舟 双 provider 可配,
# thinking 档位作为可选参数注入 API 调用。默认零变化(官方 deepseek-chat、thinking 不启用)。
# 使用说明:
#   1) 切换 provider   : 只改下方 `provider` 一行(official 或 ark)。
#   2) 启用思考        : 把 `thinking.enabled` 改成 true + effort 选 high/max,
#                        模型自动切到 v4 推理模型(thinking.model)。
#   3) 改回恢复        : enabled 还原 false 即恢复官方 deepseek-chat 现状。
# ⚠️ 成本提醒: max 档 ≈3-5 倍于 high 的 token 成本。若预测开始不准,可临时把 effort
#    改成 max 测几天作对照,测完务必改回 high 或 disabled,别长期挂 max。
providers:                            # 双 provider 定义(键名即 provider 名)
  official:                           # 官方 DeepSeek(OpenAI 兼容 /chat/completions)
    base_url: https://api.deepseek.com/v1
    supports_thinking: true           # 官方可用 deepseek-v4-flash/pro 推理模型,支持思考;默认 deepseek-chat 非思考不变
  ark:                                # 火山方舟(OpenAI 兼容 /v3/chat/completions)
    base_url: https://ark.cn-beijing.volces.com/api/v3
    supports_thinking: true           # 方舟用 v4 推理模型接入点,支持思考
provider: official                    # 当前用哪个 provider: official | ark(默认官方,改这一行即切火山)
thinking:                             # 深度思考「档位」配置
  enabled: false                      # 默认关= 官方 deepseek-chat 现状,线上预测零变化
  effort: high                        # high | max | disabled(默认 high;max 更贵,见上方成本提醒)
  disabled: false                     # effort=disabled 时等效 thinking 不启用(兼容旧格式,可省略)
  model: deepseek-v4-flash            # 启用思考时的模型:v4 推理模型(flash 性价比高;pro 更强更贵)。实际按方舟/官方可用模型名配。

# ── 月度回顾反思(P2-2,阶段1 骨架:数据采集+偏差注入 prompt)────────────
review_enabled: true          # 生成时把 history 近30日方向偏差统计注入 prompt 的"已知偏差"字段

# ── 方向锚语义教学(AI预测升级第一步,2026-08-20,默认关=线上零改动可A/B)──
#   true  = prompt 注入「方向锚」语义教学:转折因子 T(机构期货仓位转向,主权重)
#           + 联动/压制因子 L(美债10Y→黄金/利率通道/A股,纳指期货大跌压制看多,辅助权重)，
#           按影响面知识图谱 C 节调用逻辑，喂模型判方向。数据从 sentiment.db
#           (futures_position/futures_accuracy/daily_metric/index_daily)按 date 实时取，全只读。
#   false = 线上 prompt 与改造前逐字一致（生产默认，§23.7 零改动）。
#   ⚠️ 只加 T 不加 L 会让 8/18 这类「全席位大幅转多却次日暴跌」样本改错
#      (2026-08-18 nq_chg=-1.302 纳指大跌压制转多)，故 T/L 必须一起加。
direction_anchor_enabled: true  # 2026-08-28 用户拍板开启:方向锚语义教学(离线A/B验证2/3有效,线上从未开)

# ── 反思=因子归因回灌(TA Reflector 内核,AI预测自成长轮次3,2026-08-20,默认关=线上注入逐字不变)──
#   true  = build_reflection_inject 追加「待规避因子」段:聚合历史失败样本的 factor_attribution
#           (_classify_failure 落盘归因到具体误导因子: L3纳指大跌压制看多/转空信号被当偏空/
#           T1顺势看涨或均线多头强规则/T1当日失效/板块层失真)，把「该误导因子近期待规避倾向」
#           回灌下次 build_prompt 系统提示作为约束，规避/加权已证误导的因子。
#           与方向锚(语义教学)互补不互斥:归因列"某因子误导"，注入列"待规避"；同源同 DB 只读。
#   false = 线上注入文本与改造前逐字一致(生产默认，§23.7 零改动)。
reflection_factor_attribution_enabled: false

# ── 影子模式(2026-08-20,验证机制,默认 true=好收集数据)──────────────────
#   true  = 主流程后台旁路调用一次 _compute_direction_anchor(db,date) 合成影子 lean,
#           按 date 落盘 data/brief_shadow.json；次日由 scripts/aggregate_shadow.py 回填实际
#           方向聚算 7 天命中率，供用户拍板开/不开/改(§5.4 当前基准 v1.1.2 未动)。
#   ⚠️ 影子是"旁路记录,零注入":即使 true，线上 prompt(direction_anchor_enabled/reflection
#      _factor_attribution_enabled)仍全关时逐字不变——shadow 只写 data/，不发邮件/通知/不写主链。
#   验证期默认开；正式决策后再决定保留/关闭(影子文件根 data/,本地不进 git)。
shadow_mode_enabled: false  # 2026-08-28 用户拍板关闭:direction_anchor已开启,影子使命完成,不再旁路落盘
