# universe_rules.yaml — 凯利回测/首页AI建议「入样宇宙规则」单一事实源
# 规范: CLAUDE.md §23.6(2026-08-14 用户定)
# 用途: 哪些信号进凯利回测 + 首页 AI 建议候选,必须①显式声明②强制公示③1:1遵从④对称校验⑤变更联动。
#       本文件是机器校验(check_universe_alignment.py)与回测白名单(buy_whitelist)的权威来源,
#       禁止从文档/记忆反推,禁止前端自行重算宇宙。
# 注意: 本文件为「声明现状」——把此前分散隐式于 BUY_SIGNALS 白名单 / board_etf_map 构建 /
#       首页 self 兜底三处的规则显式化。改任何规则须同时更新: 本 yaml + purpose-notes.js/lab.js/
#       app.js 公示文案 + 重跑 board_etf_map/回测/export + 跑 check_universe_alignment.py(8 步联动)。

# ① 入样信号类型白名单(只回测这些买入信号; 与 scripts/signal_kelly_backtest.py BUY_SIGNALS 对齐)
buy_whitelist:
  - buy
  - buy_aux
  - buy_special
  - buy_backup

# ② 入样依赖: 一个信号要入样, 必须 board_etf_map 有该指数 key, 且 key 对应 ETF 列表里
#    至少一个 ETF 有非空 track_score(等价回测 _build_best_etf 判定 + queries.py _bt_in_universe)。
inclusion_dependency:
  require_board_etf_map_key: true
  require_track_score_non_null: true
  note: >
    与回测 _build_best_etf 判定等价; 首页 queries.py overview() 已注入
    _s["_bt_in_universe"] = any(track_score is not None for etfs), 前端 AI 建议只在此宇宙内选。

# ③ 排除类别(这些类别的不入样, 与 build_board_etf_map.py 的 board_ids 过滤 + 全球指数留空规则对齐)
#    match: 用于匹配指数 id 的前缀/字面; mode 定义"排除如何体现在 board_etf_map":
#      - absent      = 该指数 key 不应出现在 board_etf_map(整类不建映射)
#      - empty_array = 该指数 key 出现在 board_etf_map 但为空数组(无跨境 ETF, 留空展示)
excluded_categories:
  # 债类: 国债/利率类指数(cgb_idx 上证国债 / cgb_10y_etf 10年国债ETF / cgb_10y_future),无精准跨境 ETF,
  #        不建映射(absent)。除 self_etf_exception.cgb_10y_etf 由首页 self-ETF 兜底单独处理。
  - name: 债类
    match: "cgb_"
    mode: absent
    note: 国债/利率类, board_etf_map 无此 key(留空), 由 self-ETF 兜底(仅 cgb_10y_etf)单独展示。
  # 情绪: 情绪类指标(历史 id 前缀 s.), 非标的指数, 不入样。
  - name: 情绪
    match: "s."
    mode: absent
    note: 情绪指标, 非可交易标的, 不入样。
  # 全球商品利率: 全球商品/利率类指标(历史 id 前缀 g.), 非标的指数, 不入样。
  - name: 全球商品利率
    match: "g."
    mode: absent
    note: 全球商品/利率指标, 非可交易标的, 不入样。
  # 港股行业: market=hk_industry 的港股板块指数(hk_cesg10/hk_hsmbi/hk_hscci 等), build_board_etf_map
  #         board_ids 只收 industry/concept/a/hk, 不收 hk_industry(absent)。
  - name: 港股行业
    match: "hk_"
    mode: absent
    note: >
      港股行业板块指数(market=hk_industry), 无映射; 注意与 market=hk 的宽基(hsi/hscei/hstech)区分,
      后者在 universe 内。
  # 空数组: 无场内专属 ETF 的指数, map 里有 key 但为空数组(empty_array)。
  # 2026-08-25 方案A(用户拍板「尊重显式收录/关兜底」): 收录与否的单一事实源=board_etf_map,
  # 空数组=显式不入样, 不允许冻结表兜底穿透(queries.py _align_home_top1_to_backtest 已同步收窄:
  # etfs 为空数组时不 prepend 冻结条目)。调研依据: docs/kelly/analysis/universe-fallback-value-audit-20260825.md
  # (兜底唯一实例 bj50→159543 为全站最弱关联 3.9 分/近一年反向 49pp, 交易 738 笔净亏 1 万)。
  # 注1: bj50 北证50 已于 2026-08-24(v1.1.7 实施批, 用户拍板) 正式列入 match —— 配套
  #      signal_kelly_backtest.py _resolve_etf 宇宙感知剪枝(冻结值命中排除类别→读取侧剪除,
  #      freeze 文件本体不动), 历史兜底残留(freeze 72 键 / 41 笔底层交易 / 1476 展示行)重放后清零;
  #      影响面对比见 docs/kelly/analysis/bj50-residue-pruning-impact-20260824.md。
  # 注2: 无场内专属ETF属现状声明; 专属ETF配置规划见 docs/pending-features-index.md
  #      (12 个板块有场内候选可配, 跟踪度硬门槛验证后再进 map, 见调研报告§六)。
  - name: 空数组
    match:
      # 跨境(ftse100 富时100 / kospi 韩国)既定留空规则
      - ftse100
      - kospi
      # 宽基(bj50 北证50, v1.1.7 补登: 曾由 holdings_overlap 兜底错配 159543 国证2000 穿透入样)
      - bj50
      # 中证系列(csi_*, 名称以 indicators.yaml 为准)
      - csi_000680   # 科创综合
      - csi_000698   # 科创100
      - csi_000699   # 科创200
      - csi_000805   # A股资源(价格历史停更)
      - csi_000961   # 中证上游资源(价格历史停更)
      - csi_000998   # 中证TMT(价格历史停更)
      - csi_399707   # 中证申万证券行业
      - csi_399803   # 中证工业4.0
      - csi_399806   # 中证环境治理
      - csi_399807   # 中证高铁产业
      - csi_399811   # 中证申万电子行业
      - csi_399970   # 中证移动互联网
      - csi_399996   # 中证智能家居
      - csi_930820   # 中证高端制造
      - csi_931892   # 中证有色矿业
      - csi_932365   # 中证自由现金流
      - csi_932456   # 中证科创创业AI
      # 国证概念(gz_*)
      - gz_399368    # 国证军工
      - gz_399417    # 国证新能源汽车
      - gz_399431    # 国证银行
      - gz_399439    # 国证油气
      - gz_399440    # 国证钢铁
      # 申万行业(sw_*)
      # sw_801030 已移除:2026-08-27 化工ETF易方达(158017)上市,kw 命中收录(track_score=null 不入回测宇宙);
      # 详见 docs/ops/sw801030-universe-conflict-20260827.md
      - sw_801130    # 纺织服饰
      - sw_801200    # 商贸零售
      - sw_801230    # 综合
      - sw_801730    # 电力设备
      - sw_801950    # 煤炭
      - sw_801970    # 环保
      - sw_801980    # 美容护理
      # 同花顺概念(thsc_*)
      - thsc_306380  # 储能
    mode: empty_array
    note: >
      无场内专属 ETF, board_etf_map 显式保留 key 但为空数组, 前端显示"无ETF", 不入凯利回测宇宙。

# ④ 自我ETF唯一例外: func=fund_etf_hist_sina 的指数(index 本身就是 ETF, 如 cgb_10y_etf sh511260)
#    由 queries.py _self_etf_for 用 symbol 剥前缀作 ETF 代码注入(match_method="self"), board_etf_map
#    无此 key。self-ETF 条目无 track_score → 不入凯利回测宇宙(_bt_in_universe=False), 但首页仍展示
#    "index 即 ETF 自身"。改此例外须同步 queries.py _self_etf_for 判定(func=fund_etf_hist_sina)。
self_etf_exception:
  cgb_10y_etf:
    symbol: "sh511260"
    match_method: "self"
    note: "自我ETF唯一例外: 债类 cgb_10y_etf 是基金本身, 不入 board_etf_map, 由首页 self-ETF 兜底单独展示。"

# ⑤ 校验: 上述规则由 scripts/check_universe_alignment.py 机器校验(挂 deploy 链, FAIL 阻断上线)。
#    改规则 → 同步公示(purpose-notes.js lab.sigkelly + lab.js AI仓位 tooltip + app.js AI建议 tooltip)
#    → 重跑 build_board_etf_map.py → 重跑 signal_kelly_backtest.py → 重跑 export → 跑本校验 → §22 三步同步。

# ⑥ LOF 纳入规则(2026-09-14 场内 LOF 完整修复, 用户拍板「完整 5 部分」)
#    场内/场外区分=代码前缀: 场内 16/15(深)+501/502(沪), 场外 00/01/02。
#    场内 LOF 进 board_etf_map 候选池(首页 AI 建议可见), 场外 LOF 明确排除。
lof_inclusion:
  # ① 场内白名单前缀(只收这些, 其余场外前缀排除)
  on_exchange_prefixes: ["16", "15", "501", "502"]
  # ② 场外前缀(00/01/02)明确排除 + 理由
  off_exchange_prefixes: ["00", "01", "02"]
  off_exchange_reason: >
    场外 LOF(00/01/02 前缀)无 sina 场内行情且不进 etf_daily, accum_nav 恒 NULL,
    会拖垮 etf_since_return 校验(86.18% < 90% FAIL), 故 fetch+build 生成层即排除。
  # ③ 退市 LOF 过滤(2026-09-14 用户拍板「退市 LOF 全局过滤」+ reviewer 复审纠错)
  delisted_filter: >
    场内 etf_daily 零行(且经 scripts/backfill_etf_daily.py 全量回填后仍零行)=
    场内份额终止上市(现 19 只, 如 160137/501006), 场外 fund_daily_nav 仍日更净值
    能算 grade 但场内买不到 → build_board_etf_map.py 生成层过滤(不进候选池)。
    关键区分: 「净值无覆盖」LOF(场内有行情, 只是东财累计净值接口无 accum_nav)
    不是退市, 不滤; 过滤条件落在「etf_daily 零行」, 不落在「accum_nav NULL」。
  # ④ 数据源
  data_source: >
    lof_track_index.json(fundf10 jbgk 跟踪标的 + fund_open_fund_rank_em 预筛)
    + etf_daily accum_nav 回填(fund_open_fund_info_em 累计净值走势)。
  # ⑤ 入样宇宙联动
  universe_linkage: >
    board_etf_map 含场内 LOF(fund_type=lof); etf_since_return 依赖 accum_nav 补齐
    (pipeline_daily 把场内 LOF 纳入 OHLC 采集 + accum-nav 增量补齐 accum_nav)。
  # ⑥ 变更联动清单
  change_linkage:
    - check_data_integrity.py check_etf_since_return 90% 阈值场景(场内 LOF 回填后 >=90%)
    - scripts/fetch_lof_track_index.py(mask 改场内前缀 + 清存量场外条目)
    - scripts/build_board_etf_map.py(_load_lof_track_index 场内前缀防御 + _load_etf_daily_codes 退市过滤)
    - app/collector/etf_national_team.py(_etf_market 加 50 + pipeline_daily 追加场内 LOF)
