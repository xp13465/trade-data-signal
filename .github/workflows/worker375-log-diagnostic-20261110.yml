# Temporary audit branch only: retain after diagnosis; never merge into product main.
# Contract: https://docs.github.com/en/rest/actions/workflow-jobs#download-job-logs-for-a-workflow-run
name: worker375 fixed-job log diagnostic
"on":
  push:
    branches: [codex/worker375-log-diagnostic-20261110]
    paths: [.github/workflows/worker375-log-diagnostic-20261110.yml]
permissions: {}
jobs:
  read-fixed-job:
    if: github.repository == 'xp13465/trade-data-signal' && github.ref == 'refs/heads/codex/worker375-log-diagnostic-20261110'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: read
      contents: none
    steps:
      - name: Read only fixed historical job and emit redacted first error
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import http.client
          import html
          import json
          import os
          import re
          import signal
          from urllib.parse import urlsplit, urlunsplit

          REPO = "xp13465/trade-data-signal"
          BRANCH = "refs/heads/codex/worker375-log-diagnostic-20261110"
          JOB = 129272109135
          RUN = 42649615746
          HEAD = "6e3b2ea06299d664cc67e676a0b73614d32f6634"
          API = f"https://api.github.com/repos/{REPO}/actions/jobs/{JOB}"
          MAX_LOG = 8 * 1024 * 1024


          class DiagnosticError(Exception):
              def __init__(self, stage, status, code):
                  self.stage, self.status, self.code = stage, status, code


          def get(url, *, token=None, expected=200, limit=65536, stage="metadata"):
              # http.client has no automatic redirects or shared cookie jar.
              u = urlsplit(url)
              if (u.scheme != "https" or not u.hostname or u.username or u.password
                      or u.port not in (None, 443) or u.fragment or len(url) > 8192
                      or any(ord(c) <= 32 or ord(c) == 127 for c in url)):
                  raise DiagnosticError(stage, 0, "INVALID_HTTPS_URL")
              if token and url not in (API, API + "/logs"):
                  raise DiagnosticError(stage, 0, "AUTH_TARGET_REJECTED")
              headers = {"User-Agent": "worker375-readonly-diagnostic", "Accept-Encoding": "identity"}
              if token:
                  headers.update(Authorization=f"Bearer {token}", Accept="application/vnd.github+json",
                                 **{"X-GitHub-Api-Version": "2026-03-10"})
              conn = http.client.HTTPSConnection(u.hostname, port=443, timeout=12)
              try:
                  conn.request("GET", urlunsplit(("", "", u.path or "/", u.query, "")), headers=headers)
                  response = conn.getresponse()
                  if response.status != expected:
                      raise DiagnosticError(stage, response.status, "HTTP_STATUS")
                  if expected == 302:
                      location = response.getheader("Location")
                      if not location:
                          raise DiagnosticError(stage, 302, "MISSING_LOCATION")
                      return location  # Never print the signed URL or read this body.
                  if response.getheader("Content-Encoding", "identity").lower() != "identity":
                      raise DiagnosticError(stage, response.status, "UNSUPPORTED_ENCODING")
                  length = response.getheader("Content-Length")
                  if length is not None and (not length.isdecimal() or int(length) > limit):
                      raise DiagnosticError(stage, response.status, "SIZE_LIMIT_OR_INVALID_LENGTH")
                  body = bytearray()
                  while True:
                      chunk = response.read(min(65536, limit + 1 - len(body)))
                      if not chunk:
                          break
                      body.extend(chunk)
                      if len(body) > limit:
                          raise DiagnosticError(stage, response.status, "SIZE_LIMIT")
                  if length is not None and len(body) != int(length):
                      raise DiagnosticError(stage, response.status, "INCOMPLETE_BODY")
                  return bytes(body)
              finally:
                  conn.close()


          def redact(text, env):
              for key, value in sorted(env.items(), key=lambda item: len(item[1]), reverse=True):
                  if value and re.search(r"TOKEN|SECRET|PASS(?:WORD)?|CREDENTIAL|API.?KEY|ACCESS.?KEY|AUTH|COOKIE", key, re.I):
                      text = text.replace(value, "[REDACTED]")

              def clean_url(match):
                  u = urlsplit(match[0])
                  host = u.netloc.rsplit("@", 1)[-1]
                  return urlunsplit((u.scheme, host, u.path, "[REDACTED]" if u.query else "", ""))

              text = re.sub(r'https?://[^\s<>"\']+', clean_url, text)
              text = re.sub(r"([?&][^=\s&]{1,40}=)[^&\s]*", r"\1[REDACTED]", text)
              text = re.sub(r"(?is)-----BEGIN [^-]*(?:PRIVATE KEY|CREDENTIAL)[^-]*-----.*?(?:-----END [^-]+-----|\Z)", "[REDACTED]", text)
              text = re.sub(r"(?im)\b(?:Authorization|Proxy-Authorization|Cookie|Set-Cookie)\s*[:=][^\r\n]*", "[REDACTED_HEADER]", text)
              # Never parse quoted secret values: escaped quotes must not expose a tail.
              # Mask the entire remainder of this line; only preceding/separate error codes survive.
              text = re.sub(r"""(?im)(["']?[\w.-]*(?:token|secret|password|credential|private[_-]?key|api[_-]?key|access[_-]?key)[\w.-]*["']?\s*[:=])[^\r\n]*""", r"\1[REDACTED]", text)
              text = re.sub(r"\b(?:gh[pousr]_[A-Za-z0-9_]+|github_pat_[A-Za-z0-9_]+|AKIA[A-Z0-9]{16})\b", "[REDACTED]", text)
              text = re.sub(r"\beyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\b", "[REDACTED]", text)
              text = re.sub(r"(?<![A-Za-z0-9_])[A-Za-z0-9_+/=-]{32,}(?![A-Za-z0-9_])", "[REDACTED]", text)
              return text


          def clean_line(line):
              line = re.sub(r"\x1b\[[0-?]*[ -/]*[@-~]", "", line)
              line = re.sub(r"^\d{4}-\d{2}-\d{2}T\S+\s+", "", line)
              return re.sub(r"[\x00-\x08\x0b\x0c\x0e-\x1f\x7f\u2028\u2029\u202a-\u202e\u2066-\u2069]", "", line)


          def first_error(raw, env):
              lines = [clean_line(line) for line in raw.decode("utf-8", errors="replace").splitlines()]
              marker = re.compile(r"^(?:##\[error\]|(?:✘\s*)?\[ERROR\](?:\s|$)|ERROR(?:[:\s])|Error:\s)")
              for index, line in enumerate(lines):
                  if not marker.match(line.lstrip()):
                      continue
                  context = [line]
                  for following in lines[index + 1:index + 4]:
                      if following.strip():
                          context.append(following)
                          break  # Only one following nonempty context line.
                  return redact("\n".join(context), env)[:1400]
              return None


          def malformed_facts(raw):
              """Only fixed labels/templates leave the known malformed-error block."""
              lines = [clean_line(line) for line in raw.decode("utf-8", errors="replace").splitlines()]
              marker = re.compile(r"^\s*(?:##\[error\]|(?:✘\s*)?\[ERROR\](?:\s|$)|ERROR[:\s]|Error:\s)")
              start = next((i for i, line in enumerate(lines) if marker.match(line)), None)
              if start is None or "Received a malformed response from the API" not in lines[start]:
                  return None  # Other errors retain the previously reviewed redacted summary.
              block = []
              for line in lines[start + 1:start + 49]:
                  if marker.match(line) or "If you think this is a bug" in line:
                      break
                  block.append(line)
              text = "\n".join(block)[:8192]
              facts = dict(error_type="MALFORMED_API_RESPONSE", html_title="NOT_RECORDED",
                           http_status="NOT_RECORDED", api_host="NOT_RECORDED",
                           api_path="NOT_RECORDED", api_method="NOT_RECORDED",
                           wrangler_log_path_present=any(re.match(
                               r'^\s*(?:🪵\s*)?Logs were written to\s+.{1,2048}wrangler[^\r\n]{0,200}\.log["\']?\s*$', line)
                               for line in lines))
              titles = {
                  "502 bad gateway": "BAD_GATEWAY_TITLE", "bad gateway": "BAD_GATEWAY_TITLE",
                  "504 gateway time-out": "GATEWAY_TIMEOUT_TITLE", "504 gateway timeout": "GATEWAY_TIMEOUT_TITLE",
                  "503 service unavailable": "SERVICE_UNAVAILABLE_TITLE",
                  "500 internal server error": "INTERNAL_SERVER_ERROR_TITLE",
                  "403 forbidden": "FORBIDDEN_TITLE", "404 not found": "NOT_FOUND_TITLE",
                  "attention required! | cloudflare": "CLOUDFLARE_ATTENTION_TITLE",
                  "just a moment...": "JUST_A_MOMENT_TITLE",
              }
              title = re.search(r"<title\b[^>]{0,200}>([^<]{0,200})</title\s*>", text, re.I)
              if title:
                  normalized = " ".join(html.unescape(title[1]).casefold().split())
                  facts["html_title"] = titles.get(normalized, "OTHER_TITLE_REDACTED")
              elif re.search(r"<title\b", text, re.I):
                  facts["html_title"] = "INCOMPLETE_TITLE"
              # HTML/fragments have no reliable boundary from log notes. Do not
              # treat any HTTP-looking text in that block as a request/status.
              if re.search(r"<|&lt;|\bdoctype\b|\(length\s*=", text, re.I):
                  return facts
              # Only an explicit request->status or HTTP status line counts, never a title's number.
              trace = re.search(r"(?m)^\s*(GET|POST|PUT|PATCH|DELETE|HEAD)\s+(\S{1,4096})\s+->\s+([1-5]\d{2})(?:\s|$)", text)
              if trace:
                  facts["api_method"], resource, status = trace.groups()
                  facts["http_status"] = int(status)
                  u = urlsplit(resource)
                  if u.hostname:
                      facts["api_host"] = "api.cloudflare.com" if u.hostname == "api.cloudflare.com" else "OTHER_HOST_REDACTED"
                  prefix = "/client/v4" if u.path.startswith("/client/v4/") else ""
                  path = u.path[len(prefix):]
                  routes = [
                      (r"/accounts/[^/]+/workers/assets/upload", "/accounts/[REDACTED]/workers/assets/upload"),
                      (r"/accounts/[^/]+/workers/assets-upload-session", "/accounts/[REDACTED]/workers/assets-upload-session"),
                      (r"/accounts/[^/]+/workers/scripts/[^/]+", "/accounts/[REDACTED]/workers/scripts/[REDACTED]"),
                      (r"/accounts/[^/]+/workers/scripts/[^/]+/versions", "/accounts/[REDACTED]/workers/scripts/[REDACTED]/versions"),
                      (r"/accounts/[^/]+/workers/scripts/[^/]+/assets-upload-session", "/accounts/[REDACTED]/workers/scripts/[REDACTED]/assets-upload-session"),
                      (r"/accounts/[^/]+/workers/scripts/[^/]+/deployments", "/accounts/[REDACTED]/workers/scripts/[REDACTED]/deployments"),
                      (r"/accounts/[^/]+/pages/projects/[^/]+/upload-token", "/accounts/[REDACTED]/pages/projects/[REDACTED]/upload-token"),
                      (r"/accounts/[^/]+/pages/projects/[^/]+/deployments", "/accounts/[REDACTED]/pages/projects/[REDACTED]/deployments"),
                      (r"/pages/assets/upload", "/pages/assets/upload"),
                  ]
                  route = next((template for pattern, template in routes if re.fullmatch(pattern, path)), None)
                  facts["api_path"] = prefix + route if route else "OTHER_PATH_REDACTED"
              else:
                  status = re.search(r"(?m)^\s*HTTP/(?:1\.[01]|2|3)\s+([1-5]\d{2})(?:\s|$)", text)
                  if status:
                      facts["http_status"] = int(status[1])
              return facts


          def notice(message):
              escaped = message.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print("::notice title=worker375 fixed-job read-only diagnostic::" + escaped)


          def main():
              try:
                  if os.environ.get("GITHUB_REPOSITORY") != REPO or os.environ.get("GITHUB_REF") != BRANCH:
                      raise DiagnosticError("guard", 0, "TARGET_REJECTED")
                  token = os.environ.get("GITHUB_TOKEN")
                  if not token:
                      raise DiagnosticError("guard", 0, "MISSING_RUNTIME_TOKEN")
                  job = json.loads(get(API, token=token))
                  if job.get("id") != JOB or job.get("run_id") != RUN or job.get("head_sha") != HEAD:
                      raise DiagnosticError("metadata", 200, "TARGET_MISMATCH")
                  location = get(API + "/logs", token=token, expected=302, stage="logs_redirect")
                  # New connection: no Authorization, cookies, API headers or redirect chaining.
                  raw = get(location, expected=200, limit=MAX_LOG, stage="signed_download")
                  facts = malformed_facts(raw)
                  summary = json.dumps(facts, sort_keys=True) if facts is not None else first_error(raw, dict(os.environ))
                  notice(f"job={JOB} run={RUN} " + (summary if summary else "status=200 code=NO_ERROR_MARKER"))
              except DiagnosticError as exc:
                  notice(f"stage={exc.stage} status={exc.status} code={exc.code}")
              except (OSError, http.client.HTTPException):
                  notice("stage=request status=0 code=TRANSPORT_ERROR")
              except Exception:
                  # Exception strings may contain signed URLs or payloads.
                  notice("stage=diagnostic status=0 code=INVALID_RESPONSE_OR_INTERNAL_ERROR")


          def deadline(signum, frame):
              raise DiagnosticError("request", 0, "TOTAL_DEADLINE")


          if __name__ == "__main__":
              signal.signal(signal.SIGALRM, deadline)
              signal.alarm(100)
              main()
          PY
