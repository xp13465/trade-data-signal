name: Operations monitoring checks
on:
  push:
    branches: [main, 'codex/ops-*']
    paths:
      - 'ops/monitoring/**'
      - 'worker/ops*'
      - 'worker/headers.js'
      - 'static-site/admin/ops*'
      - 'static-site/sw.js'
      - 'scripts/ops_monitor.py'
      - 'scripts/delivery_evidence.py'
      - 'scripts/overfit_monitor.py'
      - 'scripts/build_min.py'
      - 'scripts/check_version_consistency.py'
      - 'scripts/signal_kelly_backtest.py'
      - 'scripts/nextday_plan_generator.py'
      - 'scripts/r2_export_proof.py'
      - 'scripts/backup_db.sh'
      - 'scripts/verify_backup.sh'
      - 'app/compute/signals.py'
      - 'static-site/export.py'
      - 'static-site/app.js'
      - 'static-site/app.min.js'
      - 'scripts/gen_schedule_stats.py'
      - 'docs/deploy/systemd-units-20260912.md'
      - 'scripts/tests/test_ops_monitor*'
      - 'scripts/tests/test_delivery_evidence*'
      - 'scripts/tests/test_overfit_assessment*'
      - 'scripts/tests/test_build_worktree_source*'
      - 'docs/ops/architecture/**'
      - 'package*.json'
      - '.github/workflows/ops-monitoring-checks.yml'
  pull_request:
    paths:
      - 'ops/monitoring/**'
      - 'worker/ops*'
      - 'worker/headers.js'
      - 'static-site/admin/ops*'
      - 'static-site/sw.js'
      - 'scripts/ops_monitor.py'
      - 'scripts/delivery_evidence.py'
      - 'scripts/overfit_monitor.py'
      - 'scripts/build_min.py'
      - 'scripts/check_version_consistency.py'
      - 'scripts/signal_kelly_backtest.py'
      - 'scripts/nextday_plan_generator.py'
      - 'scripts/r2_export_proof.py'
      - 'scripts/backup_db.sh'
      - 'scripts/verify_backup.sh'
      - 'app/compute/signals.py'
      - 'static-site/export.py'
      - 'static-site/app.js'
      - 'static-site/app.min.js'
      - 'scripts/gen_schedule_stats.py'
      - 'docs/deploy/systemd-units-20260912.md'
      - 'scripts/tests/test_ops_monitor*'
      - 'scripts/tests/test_delivery_evidence*'
      - 'scripts/tests/test_overfit_assessment*'
      - 'scripts/tests/test_build_worktree_source*'
      - 'docs/ops/architecture/**'
      - 'package*.json'
      - '.github/workflows/ops-monitoring-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ops-monitoring-${{ github.ref }}
  cancel-in-progress: true
jobs:
  local-only:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      WRANGLER_SEND_METRICS: 'false'
      CLOUDFLARE_LOAD_DEV_VARS_FROM_DOT_ENV: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          # Full regression checks pinned historical governance and hook revisions.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci --no-audit --no-fund
      # Match the main quality gate numerical dependencies for full scripts regression.
      - run: python3 -m pip install pytest pyyaml numpy==2.4.6 pandas==3.0.5 pyarrow==25.0.1
      - run: python3 -m pytest -q ops/monitoring/tests scripts/tests/test_ops_monitor.py scripts/tests/test_ops_monitor_registry.py
      - run: node --test ops/monitoring/tests/worker*.test.mjs
      - run: python3 ops/monitoring/build_baseline.py --check
      - run: npm run ops:types -- --check
      - run: python3 ops/monitoring/tests/smoke_local.py
      - run: python3 ops/monitoring/tests/smoke_benefits_pipeline.py
      - run: python3 scripts/check_unit_registry_drift.py --quiet
      - run: python3 docs/ops/architecture/tools/build_catalog.py --check
      - run: python3 docs/ops/architecture/tools/check_knowledge_base.py
      - name: Complete scripts regression
        run: |
          ops_test_status=0
          # Avoid expanded subprocess locals (including inherited env) in failed traces.
          python3 -m pytest -q scripts/tests/ ops/monitoring/tests/ --tb=short --junitxml="$RUNNER_TEMP/ops-scripts-tests.xml" || ops_test_status=$?
          python3 ops/monitoring/report_ci_tests.py "$RUNNER_TEMP/ops-scripts-tests.xml"
          exit "$ops_test_status"

  unit-compat:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify service and timer on target systemd 249 with regression control
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import re
          import shutil
          import subprocess
          import tempfile

          version = subprocess.check_output(['systemd-analyze', '--version'], text=True)
          print(version, end='', flush=True)
          major = re.match(r'systemd\s+(\d+)\b', version)
          if major is None or major.group(1) != '249':
              raise SystemExit('unit-compat requires actual systemd major 249')

          install = Path('ops/monitoring/install').resolve()
          service = install / 'trade-ops-monitor.service'
          timer = install / 'trade-ops-monitor.timer'
          # verify parses units and their dependencies; it does not start services.
          subprocess.run(['systemd-analyze', 'verify', str(service), str(timer)], check=True)

          # Change only a temporary copy; preserve unit names so the timer resolves its service.
          with tempfile.TemporaryDirectory(prefix='ops-unit-compat-', dir=os.environ['RUNNER_TEMP']) as directory:
              temporary = Path(directory)
              content = service.read_text()
              compatible = '--token-file ${CREDENTIALS_DIRECTORY}/ops_ingest_token'
              if content.count(compatible) != 1:
                  raise SystemExit('expected exactly one compatible credential path')
              (temporary / service.name).write_text(content.replace(compatible, '--token-file %d/ops_ingest_token', 1))
              shutil.copyfile(timer, temporary / timer.name)
              negative = subprocess.run(
                  ['systemd-analyze', 'verify', str(temporary / service.name), str(temporary / timer.name)],
                  stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True,
              )
              print(negative.stdout, end='', flush=True)
              if negative.returncode == 0:
                  raise SystemExit('old %d credential path unexpectedly passed systemd 249')
              if '%d/ops_ingest_token' not in negative.stdout or 'Invalid slot' not in negative.stdout:
                  raise SystemExit('negative control failed for an unrelated reason')
          print(f'SYSTEMD_249_UNIT_COMPAT_OK positive_rc=0 negative_rc={negative.returncode}')
          PY
