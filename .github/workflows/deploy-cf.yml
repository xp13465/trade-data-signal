name: Deploy to Cloudflare Workers

# 触发条件:push to main 且 static-site/ worker/ wrangler.jsonc app/ 有改动时
# 目的:替代 CF Workers Git integration(~20min 延迟),实现秒级上线
# 与 Git integration 并存,GH Actions wrangler 为加速主路径(先跑完),
# Git integration 作兜底(GH Actions 失败时仍会 deploy)
on:
  push:
    branches: [main]
    paths:
      - 'static-site/**'
      - 'worker/**'
      - 'wrangler.jsonc'
      - 'app/**'
      - '.github/workflows/deploy-cf.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

# 同一时刻只跑一个 deploy,排队不取消(避免半截状态)
concurrency:
  group: cf-workers-deploy
  cancel-in-progress: false

jobs:
  ci-gate:
    if: github.repository == 'xp13465/trade-data-signal' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m pip install PyYAML==6.0.3
      - name: 等待同 SHA 的 CI 质量门禁
        run: python3 scripts/check_release_ci_gate.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
  deploy:
    needs: ci-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Install pinned tooling
        run: npm ci --no-audit --no-fund

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m pip install PyYAML==6.0.3
      - name: 临发布复核 CI 与最新 main
        run: python3 scripts/check_release_ci_gate.py --timeout 0
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
